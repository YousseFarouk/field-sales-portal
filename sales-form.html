<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>تسجيل الزيارة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Cairo:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F6F2;
    --card:#FFFFFF;
    --text:#1C2321;
    --muted:#6B7280;
    --border:#E5E2D8;
    --primary:#0F6B5C;
    --primary-dark:#0A4F44;
    --primary-tint:#E4F0EC;
    --warn:#C97A2B;
    --warn-tint:#FBEEE0;
    --danger:#B3432D;
    --danger-tint:#F8E7E2;
    --radius:16px;
    --shadow:0 2px 12px rgba(20,25,22,0.07);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Tajawal',sans-serif;
    padding-bottom:100px;
    min-height:100vh;
  }
  h1,h2,.num{font-family:'Cairo',sans-serif;}

  .topbar{
    position:sticky; top:0; z-index:20;
    background:var(--primary);
    color:#fff;
    padding:16px 18px 20px;
    border-radius:0 0 22px 22px;
    box-shadow:var(--shadow);
  }
  .topbar h1{font-size:19px; font-weight:800; margin:0 0 2px;}
  .topbar .ws-name{font-size:12.5px; opacity:.85; margin:0;}
  .rep-row{
    margin-top:14px; display:flex; align-items:center; gap:8px;
    background:rgba(255,255,255,.14); border-radius:12px; padding:8px 12px;
  }
  .rep-row label{font-size:12.5px; opacity:.9; white-space:nowrap;}
  .rep-row input{
    flex:1; background:transparent; border:none; color:#fff;
    font-family:'Tajawal',sans-serif; font-size:14px; font-weight:500; outline:none;
  }
  .rep-row input::placeholder{color:rgba(255,255,255,.65);}

  .section{padding:16px 16px 0;}
  .card{
    background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:16px; margin-bottom:14px; border:1px solid var(--border);
  }
  .card h2{font-size:14.5px; margin:0 0 12px; display:flex; align-items:center; gap:6px;}

  .search-box{
    display:flex; align-items:center; gap:8px;
    background:var(--bg); border:1.5px solid var(--border); border-radius:12px;
    padding:11px 14px;
  }
  .search-box input{
    flex:1; border:none; background:transparent; font-family:'Tajawal',sans-serif;
    font-size:15px; outline:none; color:var(--text);
  }
  .search-box svg{flex-shrink:0; opacity:.5;}
  .clear-btn{border:none; background:none; font-size:16px; color:var(--muted); cursor:pointer; padding:2px 4px;}

  .today-row{display:flex; gap:8px; overflow-x:auto; margin-top:12px; padding-bottom:2px; scrollbar-width:none;}
  .today-row::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0; background:var(--primary-tint); color:var(--primary-dark);
    border:1px solid transparent; border-radius:999px; padding:7px 14px;
    font-size:13px; font-weight:700; cursor:pointer; white-space:nowrap;
  }
  .chip:active{transform:scale(.97);}

  .results{margin-top:10px; max-height:280px; overflow-y:auto;}
  .result-item{
    display:flex; align-items:center; justify-content:space-between;
    padding:11px 4px; border-bottom:1px solid var(--border); cursor:pointer;
  }
  .result-item:last-child{border-bottom:none;}
  .result-item:active{background:var(--bg);}
  .result-name{font-weight:700; font-size:14.5px;}
  .result-sub{font-size:12px; color:var(--muted); margin-top:2px;}
  .badge{
    font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px;
    background:var(--primary-tint); color:var(--primary-dark);
  }
  .add-new-btn{
    display:flex; align-items:center; gap:8px; width:100%; margin-top:10px;
    background:var(--primary-tint); color:var(--primary-dark); border:1.5px dashed var(--primary);
    border-radius:12px; padding:12px; font-family:'Tajawal',sans-serif; font-weight:700;
    font-size:14px; cursor:pointer;
  }

  .selected-header{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;
  }
  .selected-header .name{font-size:16px; font-weight:800;}
  .change-btn{
    border:none; background:none; color:var(--primary); font-family:'Tajawal',sans-serif;
    font-weight:700; font-size:12.5px; cursor:pointer;
  }
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12.5px; color:var(--muted); margin-bottom:5px; font-weight:500;}
  .field input, .field select, .field textarea{
    width:100%; border:1.5px solid var(--border); border-radius:11px; padding:11px 13px;
    font-family:'Tajawal',sans-serif; font-size:14.5px; color:var(--text); background:#fff; outline:none;
  }
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--primary);}
  .field textarea{resize:vertical; min-height:64px;}
  .field .error{color:var(--danger); font-size:11.5px; margin-top:4px; display:none;}
  .field.invalid input{border-color:var(--danger);}
  .field.invalid .error{display:block;}
  .stat-row{display:flex; gap:10px; margin-bottom:12px;}
  .stat{flex:1; background:var(--bg); border-radius:11px; padding:10px 12px;}
  .stat .lbl{font-size:11px; color:var(--muted);}
  .stat .val{font-size:15px; font-weight:800; margin-top:2px;}

  .segmented{display:flex; gap:8px; margin-bottom:14px;}
  .seg-btn{
    flex:1; padding:13px 8px; border-radius:12px; border:1.5px solid var(--border);
    background:#fff; font-family:'Tajawal',sans-serif; font-weight:700; font-size:14px;
    color:var(--muted); cursor:pointer; text-align:center;
  }
  .seg-btn.active-yes{background:var(--primary); border-color:var(--primary); color:#fff;}
  .seg-btn.active-no{background:var(--danger); border-color:var(--danger); color:#fff;}

  .money-row{display:flex; gap:10px;}
  .money-row .field{flex:1;}

  .gps-row{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--bg); border-radius:12px; padding:12px 14px;
  }
  .gps-text .t1{font-size:13.5px; font-weight:700;}
  .gps-text .t2{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .switch{position:relative; width:46px; height:27px; flex-shrink:0;}
  .switch input{opacity:0; width:0; height:0;}
  .slider{
    position:absolute; inset:0; background:#D8D5C9; border-radius:999px; cursor:pointer; transition:.2s;
  }
  .slider:before{
    content:""; position:absolute; height:21px; width:21px; right:3px; top:3px;
    background:#fff; border-radius:50%; transition:.2s; box-shadow:0 1px 3px rgba(0,0,0,.25);
  }
  .switch input:checked + .slider{background:var(--primary);}
  .switch input:checked + .slider:before{transform:translateX(-19px);}

  .save-bar{
    position:fixed; bottom:0; right:0; left:0; z-index:30;
    background:linear-gradient(0deg, var(--bg) 60%, transparent);
    padding:18px 16px 20px;
  }
  .save-btn{
    width:100%; background:var(--primary); color:#fff; border:none; border-radius:14px;
    padding:16px; font-family:'Cairo',sans-serif; font-weight:800; font-size:16px;
    cursor:pointer; box-shadow:0 4px 14px rgba(15,107,92,.35);
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .save-btn:disabled{opacity:.6;}
  .save-btn .spinner{
    width:16px; height:16px; border:2.5px solid rgba(255,255,255,.4); border-top-color:#fff;
    border-radius:50%; animation:spin .7s linear infinite; display:none;
  }
  .save-btn.loading .spinner{display:inline-block;}
  .save-btn.loading .lbl{display:none;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .toast{
    position:fixed; top:16px; right:16px; left:16px; z-index:50;
    background:var(--primary); color:#fff; padding:14px 18px; border-radius:14px;
    font-weight:700; font-size:14px; text-align:center; box-shadow:0 6px 20px rgba(0,0,0,.2);
    transform:translateY(-140%); transition:transform .3s ease;
  }
  .toast.error{background:var(--danger);}
  .toast.show{transform:translateY(0);}

  .gate{
    position:fixed; inset:0; background:var(--bg); z-index:100;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .gate.hidden{display:none;}
  .gate-card{background:#fff; border-radius:20px; padding:26px; box-shadow:var(--shadow); width:100%; max-width:340px; text-align:center;}
  .gate-card h1{font-size:17px; margin:0 0 6px;}
  .gate-card p{font-size:12.5px; color:var(--muted); margin:0 0 16px;}
  .gate-card input{
    width:100%; border:1.5px solid var(--border); border-radius:11px; padding:12px; text-align:center;
    font-family:'Tajawal',sans-serif; font-size:15px; margin-bottom:12px;
  }
  .gate-card button{
    width:100%; background:var(--primary); color:#fff; border:none; border-radius:11px;
    padding:12px; font-family:'Cairo',sans-serif; font-weight:800; font-size:14.5px; cursor:pointer;
  }
  .gate-card .err{color:var(--danger); font-size:12px; margin-top:8px; display:none;}

  .empty-state{text-align:center; padding:24px 10px; color:var(--muted); font-size:13px;}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }
</style>
</head>
<body>

<div class="gate hidden" id="gate">
  <div class="gate-card">
    <h1>🔒 كود الدخول</h1>
    <p>اكتب كود الدخول اللي معاك عشان تفتح الفورم</p>
    <input type="text" id="gate-input" placeholder="كود الدخول" inputmode="text">
    <button id="gate-submit">دخول</button>
    <div class="err" id="gate-err">الكود غلط، جرب تاني</div>
  </div>
</div>

<div id="app" style="display:none;">

  <div class="topbar">
    <h1>📋 تسجيل الزيارة</h1>
    <p class="ws-name" id="ws-name">خطوط سير المندوبين</p>
    <div class="rep-row">
      <label for="rep-name">👤 المندوب:</label>
      <input type="text" id="rep-name" placeholder="اكتب اسمك">
    </div>
  </div>

  <div class="section" id="picker-section">
    <div class="card">
      <h2>👤 اختار العميل</h2>
      <div class="search-box">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="search-input" placeholder="دور بالاسم أو رقم التليفون">
        <button class="clear-btn" id="clear-search" style="display:none;">✕</button>
      </div>
      <div class="today-row" id="today-row"></div>
      <div class="results" id="results-list"></div>
      <button class="add-new-btn" id="add-new-btn" style="display:none;">
        <span>➕</span><span id="add-new-label">إضافة عميل جديد</span>
      </button>
    </div>
  </div>

  <div class="section" id="form-section" style="display:none;">

    <div class="card">
      <div class="selected-header">
        <span class="name" id="selected-name-display">—</span>
        <button class="change-btn" id="change-client-btn">تغيير العميل ↺</button>
      </div>

      <div class="stat-row" id="stat-row" style="display:none;">
        <div class="stat"><div class="lbl">آخر فاتورة</div><div class="val num" id="stat-last">—</div></div>
        <div class="stat"><div class="lbl">مجموع الفواتير</div><div class="val num" id="stat-total">—</div></div>
      </div>

      <div class="field">
        <label>👤 اسم العميل</label>
        <input type="text" id="c-name">
      </div>
      <div class="field">
        <label>🏷️ التصنيف (نوع النشاط)</label>
        <input type="text" id="c-category" placeholder="مثال: مغسلة، محل بويات...">
      </div>
      <div class="field" id="phone-field">
        <label>📞 رقم التليفون</label>
        <input type="tel" id="c-phone" inputmode="numeric" maxlength="11">
        <div class="error">رقم غير صحيح — 11 رقم يبدأ بـ 010/011/012/015</div>
      </div>
      <div class="field">
        <label>📍 العنوان يدوياً</label>
        <input type="text" id="c-address" placeholder="اختياري">
      </div>
    </div>

    <div class="card">
      <h2>✅ حالة الزيارة</h2>
      <div class="segmented">
        <button class="seg-btn" id="status-yes" type="button">✅ تمت بنجاح</button>
        <button class="seg-btn" id="status-no" type="button">❌ لم تتم</button>
      </div>

      <div id="yes-fields" style="display:none;">
        <div class="money-row">
          <div class="field">
            <label>💰 قيمة الفاتورة (جنيه)</label>
            <input type="number" id="v-invoice" inputmode="decimal" min="0" placeholder="0">
          </div>
          <div class="field">
            <label>💵 المدفوع الآن (جنيه)</label>
            <input type="number" id="v-paid" inputmode="decimal" min="0" placeholder="0">
          </div>
        </div>
      </div>

      <div class="field" id="reason-field" style="display:none;">
        <label>سبب عدم الزيارة *</label>
        <textarea id="v-reason" placeholder="السبب مطلوب لو الزيارة لم تتم"></textarea>
        <div class="error">السبب مطلوب</div>
      </div>

      <div class="field" style="margin-bottom:0;">
        <label>📝 ملاحظة (اختياري)</label>
        <textarea id="v-note" placeholder="أي تفاصيل حابب تسجلها..."></textarea>
      </div>
    </div>

    <div class="card">
      <div class="gps-row">
        <div class="gps-text">
          <div class="t1">📍 تحديد الموقع الجغرافي</div>
          <div class="t2" id="gps-status">هيتحدد تلقائي وقت الحفظ</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="gps-toggle" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>

  </div>
</div>

<div class="save-bar" id="save-bar" style="display:none;">
  <button class="save-btn" id="save-btn">
    <span class="spinner"></span>
    <span class="lbl">💾 حفظ الزيارة</span>
  </button>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  var DAY_NAMES = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  var params = new URLSearchParams(window.location.search);
  var SCRIPT_URL = params.get('script') || '';
  var ACCESS_KEY = params.get('key') || sessionStorage.getItem('fsp_key') || '';

  var clients = [];
  var selectedClient = null;
  var isNewClient = false;
  var visitStatus = null;

  var $ = function(id){ return document.getElementById(id); };
  var gate = $('gate'), gateInput = $('gate-input'), gateSubmit = $('gate-submit'), gateErr = $('gate-err');
  var app = $('app');

  function showToast(msg, isError){
    var t = $('toast');
    t.textContent = msg;
    t.className = 'toast show' + (isError ? ' error' : '');
    setTimeout(function(){ t.className = 'toast'; }, 2600);
  }

  function boot(){
    if (!SCRIPT_URL){
      showToast('الرابط ده ناقص — كلم صاحب النظام', true);
      return;
    }
    if (!ACCESS_KEY){
      gate.classList.remove('hidden');
      return;
    }
    startApp();
  }

  gateSubmit.addEventListener('click', function(){
    var val = gateInput.value.trim();
    if (!val){ return; }
    ACCESS_KEY = val;
    sessionStorage.setItem('fsp_key', val);
    gateErr.style.display = 'none';
    gate.classList.add('hidden');
    startApp();
  });

  function startApp(){
    app.style.display = 'block';
    $('save-bar').style.display = 'block';
    var savedRep = localStorage.getItem('fsp_rep_name');
    if (savedRep) $('rep-name').value = savedRep;
    loadClients();
  }

  function apiUrl(action, extraParams){
    var separator = SCRIPT_URL.indexOf('?') !== -1 ? '&' : '?';
    var u = SCRIPT_URL + separator + 'action=' + action + '&key=' + encodeURIComponent(ACCESS_KEY);
    if (extraParams){
      Object.keys(extraParams).forEach(function(k){
        u += '&' + k + '=' + encodeURIComponent(extraParams[k]);
      });
    }
    return u;
  }

  function loadClients(){
    $('results-list').innerHTML = '<div class="empty-state">جاري تحميل العملاء...</div>';
    fetch(apiUrl('getAllClients'))
      .then(function(r){ return r.json(); })
      .then(function(res){
        if (!res.ok){
          if (res.error && res.error.indexOf('مصرح') !== -1){
            sessionStorage.removeItem('fsp_key');
            gate.classList.remove('hidden');
            app.style.display = 'none';
            gateErr.style.display = 'block';
            return;
          }
          showToast(res.error || 'حصل خطأ في تحميل العملاء', true);
          return;
        }
        clients = res.data || [];
        renderTodayChips();
        renderResults('');
      })
      .catch(function(err){
        console.error('loadClients error:', err);
        showToast('مفيش اتصال بالإنترنت — جرب تاني', true);
      });
  }

  function renderTodayChips(){
    var todayName = DAY_NAMES[new Date().getDay()];
    var todayClients = clients.filter(function(c){ return c.usualDay === todayName; });
    var row = $('today-row');
    if (todayClients.length === 0){ row.innerHTML=''; return; }
    row.innerHTML = '<span style="font-size:12px;color:var(--muted);align-self:center;">مقترح اليوم:</span>';
    todayClients.forEach(function(c){
      var chip = document.createElement('button');
      chip.className = 'chip';
      chip.textContent = c.name;
      chip.addEventListener('click', function(){ selectClient(c); });
      row.appendChild(chip);
    });
  }

  var searchInput = $('search-input');
  searchInput.addEventListener('input', function(){
    $('clear-search').style.display = this.value ? 'block' : 'none';
    renderResults(this.value.trim());
  });
  $('clear-search').addEventListener('click', function(){
    searchInput.value = '';
    this.style.display = 'none';
    renderResults('');
  });

  function renderResults(query){
    var list = $('results-list');
    var addBtn = $('add-new-btn');
    var q = query.toLowerCase();
    var filtered = q ? clients.filter(function(c){
      return c.name.toLowerCase().indexOf(q) !== -1 || (c.phone || '').indexOf(q) !== -1;
    }) : clients.slice(0, 25);

    if (filtered.length === 0){
      list.innerHTML = q ? '<div class="empty-state">مفيش نتائج مطابقة</div>' : '<div class="empty-state">ابدأ اكتب اسم أو رقم تليفون</div>';
    } else {
      list.innerHTML = '';
      filtered.forEach(function(c){
        var item = document.createElement('div');
        item.className = 'result-item';
        item.innerHTML =
          '<div><div class="result-name"></div><div class="result-sub"></div></div>' +
          (c.category ? '<span class="badge"></span>' : '');
        item.querySelector('.result-name').textContent = c.name;
        item.querySelector('.result-sub').textContent = c.phone || '';
        if (c.category) item.querySelector('.badge').textContent = c.category;
        item.addEventListener('click', function(){ selectClient(c); });
        list.appendChild(item);
      });
    }

    addBtn.style.display = (q && filtered.length === 0) ? 'flex' : 'none';
    $('add-new-label').textContent = q ? ('إضافة "' + query + '" كعميل جديد') : 'إضافة عميل جديد';
    addBtn.onclick = function(){ selectClient(null, query); };
  }

  function selectClient(client, newName){
    isNewClient = !client;
    selectedClient = client;

    $('picker-section').style.display = 'none';
    $('form-section').style.display = 'block';

    $('selected-name-display').textContent = client ? client.name : '🆕 عميل جديد';
    $('c-name').value = client ? client.name : (newName || '');
    $('c-category').value = client ? (client.category || '') : '';
    $('c-phone').value = client ? (client.phone || '') : '';
    $('c-address').value = client ? (client.manualAddress || '') : '';
    $('phone-field').classList.remove('invalid');

    if (client){
      $('stat-row').style.display = 'flex';
      $('stat-last').textContent = '...';
      $('stat-total').textContent = '...';
      fetch(apiUrl('getClientDetails', {phone: client.phone}))
        .then(function(r){ return r.json(); })
        .then(function(res){
          if (res.ok && res.data){
            $('stat-last').textContent = (res.data.lastInvoice || 0) + ' ج';
            $('stat-total').textContent = (res.data.totalInvoices || 0) + ' ج';
          }
        })
        .catch(function(err){
          console.error('getClientDetails error:', err);
          $('stat-last').textContent = '—';
          $('stat-total').textContent = '—';
        });
    } else {
      $('stat-row').style.display = 'none';
    }

    visitStatus = null;
    $('status-yes').className = 'seg-btn';
    $('status-no').className = 'seg-btn';
    $('yes-fields').style.display = 'none';
    $('reason-field').style.display = 'none';
    $('v-invoice').value = '';
    $('v-paid').value = '';
    $('v-reason').value = '';
    $('v-note').value = '';
    window.scrollTo({top:0, behavior:'smooth'});
  }

  $('change-client-btn').addEventListener('click', function(){
    $('form-section').style.display = 'none';
    $('picker-section').style.display = 'block';
    selectedClient = null;
    window.scrollTo({top:0, behavior:'smooth'});
  });

  $('status-yes').addEventListener('click', function(){
    visitStatus = 'نعم';
    $('status-yes').className = 'seg-btn active-yes';
    $('status-no').className = 'seg-btn';
    $('yes-fields').style.display = 'block';
    $('reason-field').style.display = 'none';
  });
  $('status-no').addEventListener('click', function(){
    visitStatus = 'لا';
    $('status-no').className = 'seg-btn active-no';
    $('status-yes').className = 'seg-btn';
    $('yes-fields').style.display = 'none';
    $('reason-field').style.display = 'block';
  });
  $('v-invoice').addEventListener('input', function(){
    if (!$('v-paid').dataset.touched){ $('v-paid').value = this.value; }
  });
  $('v-paid').addEventListener('input', function(){ this.dataset.touched = '1'; });

  $('rep-name').addEventListener('change', function(){
    localStorage.setItem('fsp_rep_name', this.value.trim());
  });

  function isValidPhone(p){
    return /^01[0125]\d{8}$/.test(p);
  }

  $('save-btn').addEventListener('click', function(){
    var name = $('c-name').value.trim();
    var phone = $('c-phone').value.trim();
    var category = $('c-category').value.trim();
    var address = $('c-address').value.trim();

    if (!name){ showToast('اكتب اسم العميل الأول', true); return; }
    if (!isValidPhone(phone)){
      $('phone-field').classList.add('invalid');
      showToast('رقم التليفون مش صحيح', true);
      return;
    }
    $('phone-field').classList.remove('invalid');

    if (!visitStatus){ showToast('حدد حالة الزيارة الأول', true); return; }
    var reason = $('v-reason').value.trim();
    if (visitStatus === 'لا' && !reason){
      $('reason-field').classList.add('invalid');
      showToast('اكتب سبب عدم الزيارة', true);
      return;
    }
    $('reason-field').classList.remove('invalid');

    var repName = $('rep-name').value.trim();
    var note = $('v-note').value.trim();
    var invoiceValue = $('v-invoice').value || 0;
    var paidNow = $('v-paid').value || 0;
    var gpsOn = $('gps-toggle').checked;

    setSaving(true);

    var proceed = function(lat, lng, region, detailedAddress){
      var chain = Promise.resolve();

      if (isNewClient){
        chain = chain.then(function(){
          return fetch(apiUrl('addNewClient', {name:name, phone:phone, address:address, category:category}))
            .then(function(r){ return r.json(); })
            .then(function(res){
              if (!res.ok) {
                throw new Error(res.error || 'فشل إضافة العميل');
              }
            });
        });
      } else if (selectedClient && (selectedClient.name !== name || selectedClient.category !== category || selectedClient.manualAddress !== address || selectedClient.phone !== phone)){
        chain = chain.then(function(){
          return fetch(apiUrl('updateClientDetails', {phone: selectedClient.phone, newName:name, newPhone:phone, address:address, category:category}))
            .then(function(r){ return r.json(); })
            .then(function(res){
              if (!res.ok) {
                throw new Error(res.error || 'فشل تحديث بيانات العميل');
              }
            });
        });
      }

      chain.then(function(){
        return fetch(apiUrl('saveVisit', {
          name:name, status:visitStatus, lat: lat===null?'':lat, lng: lng===null?'':lng,
          reason:reason, phone:phone, category:category,
          invoiceValue:invoiceValue, paidNow:paidNow,
          region:region, detailedAddress:detailedAddress,
          repName:repName, note:note
        })).then(function(r){ return r.json(); });
      }).then(function(res){
        setSaving(false);
        if (res && res.ok){
          showToast('✅ ' + (res.message || 'تم الحفظ بنجاح'));
          resetToPicker();
        } else {
          showToast((res && res.error) || 'حصل خطأ، جرب تاني', true);
        }
      }).catch(function(err){
        setSaving(false);
        console.error('saveVisit error:', err);
        showToast(err.message || 'مفيش اتصال — جرب تاني', true);
      });
    };

    if (gpsOn && navigator.geolocation){
      $('gps-status').textContent = 'جاري تحديد الموقع...';
      navigator.geolocation.getCurrentPosition(function(pos){
        var lat = pos.coords.latitude, lng = pos.coords.longitude;
        reverseGeocode(lat, lng, function(region, detailedAddress){
          proceed(lat, lng, region, detailedAddress);
        });
      }, function(){
        proceed(null, null, 'موقع غير محدد', address || 'لم يُحدد بعد');
      }, {timeout: 8000});
    } else {
      proceed(null, null, 'موقع غير محدد', address || 'لم يُحدد بعد');
    }
  });

  function reverseGeocode(lat, lng, cb){
    fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat=' + lat + '&lon=' + lng + '&accept-language=ar')
      .then(function(r){ return r.json(); })
      .then(function(d){
        var a = d.address || {};
        var region = a.suburb || a.neighbourhood || a.city_district || a.town || a.city || 'موقع غير محدد';
        var detailed = d.display_name || 'لم يُحدد بعد';
        cb(region, detailed);
      })
      .catch(function(){ cb('موقع غير محدد', 'لم يُحدد بعد'); });
  }

  function setSaving(state){
    var btn = $('save-btn');
    btn.disabled = state;
    btn.className = 'save-btn' + (state ? ' loading' : '');
  }

  function resetToPicker(){
    $('form-section').style.display = 'none';
    $('picker-section').style.display = 'block';
    selectedClient = null;
    $('search-input').value = '';
    $('gps-status').textContent = 'هيتحدد تلقائي وقت الحفظ';
    loadClients();
    window.scrollTo({top:0, behavior:'smooth'});
  }

  boot();
})();
</script>

</body>
</html>
